# CI for HighScoreServer.
#
# Two parallel jobs: pytest (against an ephemeral Postgres) and ruff lint.
# Both install from requirements-dev.txt so dev tool versions match local.
#
# A note on the Postgres version: this is pinned to match Heroku production
# (currently 17). When Heroku eventually upgrades, bump this to match —
# `heroku pg:info` shows the live version. Major-version drift between CI
# and prod is exactly the kind of bug this workflow exists to catch, so
# it's worth keeping in sync.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older in-progress runs when a new commit lands on the same ref.
# Mostly useful for PRs where I push fix-up commits in quick succession.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        # Official pgvector image layered on PostgreSQL 17. The version is
        # pinned to Heroku's documented pgvector version so migrations cannot
        # accidentally rely on a newer extension feature.
        image: pgvector/pgvector@sha256:40b404964359299eefdd5f8518facf1886c562848cf4de13b6eaf91cb70c2b87
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: highscore_test
        ports:
          - 5432:5432
        # Without the health check, the schema-apply step occasionally races
        # the container startup and fails with "connection refused".
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Credentials here are duplicated from the postgres service definition above.
      # If I change one, I have to change the other.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/highscore_test
      VAULT_ENABLED: "true"
      # Exercise the documented production-shaped 4/2 split. Keeping CI on
      # 5/1 hid the two-caller vault timeout that motivated this allocation.
      HSS_DB_POOL_MAX_SIZE: "4"
      HSS_PROCESS_COUNT: "2"
      DATABASE_CONNECTION_LIMIT: "20"
      DB_OPERATIONAL_CONNECTION_RESERVE: "2"
      VAULT_DB_POOL_SIZE: "2"
      VAULT_DB_POOL_TIMEOUT_SECONDS: "5"
      # Pinned explicitly rather than left to the default: this value is compiled
      # into the search_vector generated column at migration time, so the schema
      # drift test needs a fixed target to compare against.
      VAULT_TEXT_SEARCH_CONFIG: english
      # API_KEY and JWT_SECRET are functional fixtures, not real secrets — the
      # test suite doesn't validate them against any external system, it just
      # needs them to be set. Inlining is intentional; promoting them to
      # repository secrets would be cargo-culting.
      API_KEY: ci-test-api-key
      JWT_SECRET: ci-test-jwt-secret-not-used-against-real-tokens

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Both files are part of the cache key so bumping a dev tool version
          # actually invalidates the cache.
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Build the schema with Alembic — the source of truth (ADR 0009). This is
      # the documented fresh-DB path; db/schema.sql is only a 0001-era bootstrap
      # snapshot and omits the 0002 objects (runs, submission_idempotency, the
      # additive game_modes/scores columns), so applying it would leave the test
      # DB under-built and the suite would fail with UndefinedColumn/Table.
      # A failed migration exits non-zero and fails the job. env.py reads
      # DATABASE_URL (not TEST_DATABASE_URL).
      - name: Apply database schema (alembic upgrade head)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/highscore_test
        run: |
          alembic upgrade head
          alembic -c alembic-vault.ini upgrade head

      - name: Run pytest
        run: pytest -v

  lint:
    name: ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app/ tests/ scripts/
