# Configuration for Python tooling. Heroku build manifests
# (requirements.txt, .python-version, Procfile) are intentionally kept
# separate — the buildpack reads those, not this file.

[tool.ruff]
# There is no [project] table, so ruff cannot infer the Python version from
# requires-python and has to be told. This MUST be the oldest interpreter the
# code runs on -- CI and Heroku are both pinned to 3.12, the latter by
# .python-version -- not whatever is installed locally.
# Setting it to a newer version makes ruff "modernize" code into syntax the
# real runtime rejects: UP037 stripped the quotes from three forward
# references, which 3.14 tolerates (PEP 649 defers annotation evaluation) and
# 3.12 raises NameError on at import time.
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# E4/E7/E9 + F are ruff's defaults. The rest were chosen by measuring the
# findings each produced against this tree rather than by taking a ruleset
# wholesale:
#   W    whitespace, all mechanical
#   I    import sorting, all auto-fixable
#   B    bugbear -- B904 (losing the __cause__ chain when re-raising as
#        HTTPException) and B905 (zip without strict=) are the two that have
#        actually bitten here
#   C4   comprehension rewrites
#   RET  redundant control flow after return
#   UP   syntax now available on the pinned Python
#
# Deliberately NOT enabled. Counts are `ruff check --select <rule> .` over the
# whole tree, measured 2026-09-02 -- state the date, because the previous set
# was off by up to 8x and nothing said so. They are context for the decision,
# not a gate; re-measure before quoting one.
#   E501   (196) line length -- 27 in app/vault/, the rest legacy leaderboard
#          and test modules. Worth its own pass, not a gate.
#   S    (2,647) bandit -- overwhelmingly assert-in-tests.
#   ARG    (247) unused arguments -- FastAPI dependencies and pytest fixtures
#          are unused by construction.
#   SIM     (34) -- 23 are SIM117, which would merge `async with` blocks that
#          are clearer nested.
#   T20    (313) print -- scripts/ exists to print.
#   N       (34) -- 32 are N818, and the embedding exception names are
#          deliberate; the other two are one N802 and one N811.
select = ["E4", "E7", "E9", "F", "W", "I", "B", "C4", "RET", "UP"]

ignore = [
    # UP042 wants the seven `class X(str, Enum)` declarations rewritten as
    # `StrEnum`. That is a behaviour change wearing a modernization's clothes:
    # `str(X.MEMBER)` is "X.MEMBER" under (str, Enum) and "member" under
    # StrEnum, and these types are Pydantic response fields and SQL values on
    # a shipped API. ruff marks the fix unsafe for exactly this reason. Worth
    # doing deliberately, with tests, as its own change -- not as lint drift.
    "UP042",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection *is* a function call in a default argument, so
# B008 fires on every route. These are the framework's markers, not mutable
# defaults; without this, the correct fix looks like a violation.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.lint.isort]
# The codebase separates imports from module-level code by two blank lines.
# ruff's default (-1, "auto") collapses that to one across ~40 files, which is
# a reformat of existing code rather than a lint fix.
lines-after-imports = 2

[tool.pytest.ini_options]
# Async-mode tests (e.g. the cache backend, which is now an async interface)
# run without a per-test @pytest.mark.asyncio. API tests still use the sync
# Starlette TestClient, which is unaffected by this setting.
asyncio_mode = "auto"
filterwarnings = [
    # slowapi 0.1.9 uses deprecated asyncio.iscoroutinefunction. Removal isn't
    # until Python 3.16; the warning is informational on 3.14. Filter scoped
    # to slowapi only so our own deprecations remain visible.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi.*",
    # conftest forces the SelectorEventLoop policy on Windows so psycopg3's async
    # pool can run (ProactorEventLoop lacks add_reader/add_writer). Python 3.14
    # deprecates the policy API (removal 3.16), but it remains the only lever that
    # reaches the TestClient's anyio portal. Windows-dev-only; no-op on CI/Linux.
    "ignore:'asyncio.WindowsSelectorEventLoopPolicy' is deprecated:DeprecationWarning",
    "ignore:'asyncio.set_event_loop_policy' is deprecated:DeprecationWarning",
]