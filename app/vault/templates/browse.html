<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault browse</title>
<style>
{% include "_console_style.css" %}

/* Browsing only, from here down. */
.crumbs { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-bottom: 0.9rem; }
.crumbs .sep { color: var(--muted); }
.filters { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: end; margin-bottom: 1rem; }
.field { display: flex; flex-direction: column; gap: 0.15rem; }
/* The shared stylesheet dresses text fields by type and leaves the rest to the
   browser; a line number is a text field in every way that matters here. */
input[type="number"] {
  font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 0.3rem 0.5rem;
  width: 6rem;
}
textarea {
  font: inherit; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.86rem; width: 100%; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 0.5rem 0.6rem;
  margin: 0.5rem 0;
}
/* The span being replaced, quoted back so the operator can see exactly what
   the server will be asked to match. */
.excerpt { white-space: pre-wrap; overflow-wrap: anywhere; }
/* Markdown source, shown as written. Overrides the shared `pre` because a note
   body is the page's content rather than a quoted fragment inside a card. */
.body {
  white-space: pre-wrap; overflow-wrap: anywhere; background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 0.9rem 1rem;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.86rem; margin: 0.8rem 0 0;
}
</style>
</head>
<body>
{% set vault_page = "browse" %}
{% set vault_title = "Browse" %}
{% set vault_session_controls = true %}
{% include "_vault_header.html" %}
<main>
  <div id="messages"></div>
  <div id="app" class="hidden">
    <div id="crumbs" class="crumbs"></div>
    <div class="filters">
      <!-- Labelled, not merely placeheld. A placeholder is not an accessible
           name, and it disappears exactly when the field has content -- so the
           one moment a reader most needs to know what "hss" is filtering is
           the moment the hint is gone. -->
      <label class="field" for="filter-tag">
        <span class="small muted">Tag</span>
        <input id="filter-tag" placeholder="hss" size="14">
      </label>
      <label class="field" for="filter-facet">
        <span class="small muted">Facet</span>
        <input id="filter-facet" placeholder="project:hss" size="24">
      </label>
      <button id="apply-filters">Filter</button>
      <button id="clear-filters">Clear</button>
    </div>
    <div id="folders"></div>
    <div id="listing"></div>
    <div id="note" class="hidden"></div>
  </div>
</main>

<script id="cfg" type="application/json" nonce="{{ csp_nonce }}">{{ {"apiBase": api_base, "scopes": scopes,
  "consolePath": console_path, "clientName": client_name,
  "storePrefix": store_prefix} | tojson }}</script>
<script nonce="{{ csp_nonce }}">
"use strict";
{% include "_console_session.js" %}

/* ---------- Browse state ----------

   Deliberately module-level rather than in the URL. A console path carrying a
   `?path=` would be a second thing `boot()` reads out of the query string,
   beside the OAuth `code` and `error` it already parses there -- and the
   authorization callback rewrites that query on arrival, so a browse location
   would not survive a sign-in anyway. */
let PREFIX = "";
let FILTERS = { tag: "", facet: "" };
let ROWS = [];
/* Folders already shown, so an appended page adds the ones it discovers
   without repeating those already on screen. */
let FOLDERS = [];
/* The open note, as fetched. Held rather than re-read from the DOM because a
   span edit is resolved against the body the server sent and the revision it
   sent it at -- neither of which the rendered page is the authority on. */
let NOTE = null;
/* A fresh request is only a candidate listing until it succeeds. Pagination
   remains bound to this last committed query while a replacement is pending
   or after it fails. */
let LISTING_REQUEST_GENERATION = 0;
let LISTING_GENERATION = 0;
let LISTING_VIEW_GENERATION = 0;
let COMMITTED_LISTING = null;
let NOTE_GENERATION = 0;

/* ---------- Listing ---------- */
function listingParams(query, cursor) {
  const params = new URLSearchParams();
  if (query.prefix) params.set("path", query.prefix);
  if (query.filters.tag) params.set("tag", query.filters.tag);
  if (query.filters.facet) params.set("facet", query.filters.facet);
  params.set("limit", "50");
  if (cursor) params.set("after", cursor);
  return params;
}

function crumbs() {
  /* Every prefix of the current path, so going up is one click rather than an
     edit. The root is always first: a listing with no prefix is the whole
     readable corpus, which is a real place to stand rather than an empty
     state. */
  const box = $("crumbs");
  box.textContent = "";
  const root = el("button", "link", "vault");
  root.onclick = () => { PREFIX = ""; loadAll(); };
  box.appendChild(root);

  const parts = PREFIX.split("/").filter((part) => part.length);
  let walked = "";
  for (const part of parts) {
    walked += part + "/";
    const here = walked;
    box.appendChild(el("span", "sep", "/"));
    const crumb = el("button", "link", part);
    crumb.onclick = () => { PREFIX = here; loadAll(); };
    box.appendChild(crumb);
  }
}

function folderOf(vaultPath) {
  const cut = vaultPath.lastIndexOf("/");
  return cut === -1 ? "" : vaultPath.slice(0, cut + 1);
}

/* Folders derived from the notes seen so far, not fetched. The listing
   endpoint returns notes, and asking it for a folder tree would be asking a
   second question of a surface that answers one. What this shows is therefore
   partial -- the folders of the notes loaded so far -- and it says so.

   Rendered per page rather than once. Folders came from the first page alone,
   so a folder whose notes sort after the first fifty never became navigable:
   `Load more` grew the list and the folder cards did not. */
function renderFolders(rows) {
  const panel = $("folders");
  for (const row of rows) {
    const folder = folderOf(row.vault_path);
    if (!folder || folder === PREFIX || FOLDERS.includes(folder)) continue;
    FOLDERS.push(folder);
    const card = el("div", "card");
    const into = el("button", "link title", folder);
    into.onclick = () => { PREFIX = folder; loadAll(); };
    card.appendChild(into);
    card.appendChild(el("span", "small muted", "  folder"));
    panel.appendChild(card);
  }
}

function noteRow(row) {
  const card = el("div", "card");
  const head = el("div", "row");
  const open = el("button", "link title", row.title);
  /* Caught, not left to reject unhandled: `openNote` is async and this is the
     only caller. */
  open.onclick = () => openNote(row.note_id).catch(showError);
  head.appendChild(open);
  head.appendChild(el("span", "chip", row.kind));
  if (row.doc_status) head.appendChild(el("span", "chip", row.doc_status));
  if (row.status !== "active") head.appendChild(el("span", "chip", row.status));
  card.appendChild(head);
  card.appendChild(el("div", "small muted mono", row.vault_path));
  if (row.summary) card.appendChild(el("div", "small", row.summary));
  return card;
}

async function renderListing(append, committed = COMMITTED_LISTING) {
  const viewGeneration = LISTING_VIEW_GENERATION;
  const requestGeneration = append
    ? null
    : ++LISTING_REQUEST_GENERATION;
  const query = append
    ? committed && committed.query
    : { prefix: PREFIX, filters: { ...FILTERS } };
  const requestedCursor = append && committed ? committed.cursor : null;
  if (!query) return;
  let page;
  try {
    page = await api("/notes?" + listingParams(query, requestedCursor).toString());
  } catch (err) {
    /* A superseded failure belongs to a view the operator already left. */
    if (viewGeneration !== LISTING_VIEW_GENERATION
        || (!append && requestGeneration !== LISTING_REQUEST_GENERATION)
        || (append && committed !== COMMITTED_LISTING)) return;
    throw err;
  }
  if (viewGeneration !== LISTING_VIEW_GENERATION
      || (!append && requestGeneration !== LISTING_REQUEST_GENERATION)
      || (append && committed !== COMMITTED_LISTING)) return;

  const panel = $("listing");
  if (!append) {
    /* Commit the replacement only after it exists. A failed refresh leaves the
       current rows and pagination control available rather than a blank view. */
    panel.textContent = "";
    $("folders").textContent = "";
    ROWS = [];
    FOLDERS = [];
  }
  ROWS = ROWS.concat(page.notes);
  COMMITTED_LISTING = {
    query,
    cursor: page.next_cursor,
    generation: append ? committed.generation : ++LISTING_GENERATION,
  };

  if (!append) crumbs();
  renderFolders(page.notes);

  for (const row of page.notes) panel.appendChild(noteRow(row));

  if (!ROWS.length && !FOLDERS.length) {
    panel.appendChild(el("div", "card muted",
      "Nothing here. The read policy withholds folders the vault does not "
      + "publish, so an empty folder and an unpublished one look the same."));
  }

  /* One button, replaced each time rather than accumulated. `has_more` is read
     from a row past the limit, so it means what it says. */
  const more = $("more");
  if (more) more.remove();
  if (page.has_more) {
    const button = el("button", null, "Load more");
    button.id = "more";
    const listing = COMMITTED_LISTING;
    button.onclick = async () => {
      button.disabled = true;
      try {
        await renderListing(true, listing);
      } catch (err) {
        showError(err);
      } finally {
        /* On success this is the detached old button; on failure it is still
           the live retry control. Re-enabling is harmless in both states. */
        button.disabled = false;
      }
    };
    panel.appendChild(button);
  }
}

/* ---------- One note ---------- */

/* Must not exceed the server's MAX_EDGE_LOOKUP_IDS -- `/notes/edges` answers 422 for
   a longer list, and the console would then resolve nothing for exactly the
   notes with the most edges. `tests/vault/test_browse_console.py` asserts the
   two agree, since they live in different files and nothing else would say. */
const EDGE_LOOKUP_BATCH = 100;

/* The most requests one note may spend resolving its edges. The quota bursts
   at 20, and nothing bounds a compiled page's `source_ids`, so a large enough
   page could drain the whole allowance and leave the reader's next click
   rate-limited. Half the burst keeps that headroom; ids past it are honestly
   marked "not looked up", because they were not. */
const EDGE_LOOKUP_MAX_BATCHES = 10;

/* Resolve a note's edges to names, in as few requests as the bound allows.

   `related_ids` and `source_ids` hold ids and stay that way in storage
   (ADR 0025), so showing them to a person is a lookup. One request for every
   edge of the note rather than one per edge: fetching each note to read its
   title is what exhausted the review console's `get_note` quota rendering a
   queue, and this is the same shape.

   Never fatal: the note opens whatever this returns. But a failed lookup is
   reported as a failure rather than folded into an empty result. Returning
   `new Map()` on error made every edge indistinguishable from one the corpus
   genuinely cannot resolve, so a 429 -- readily reached, the bucket is 20 --
   or a 503 or a dropped request rendered as "this note is retired or you may
   not read it" about every edge at once. That is infrastructure trouble
   presented as fact about the corpus, and the reader has no way to tell. */
async function resolveEdges(ids, stillWanted) {
  if (!ids.length) return { edges: new Map(), lookedUp: new Set() };
  const edges = new Map();
  /* Which ids a batch actually answered for, rather than one flag for the
     whole run. A single `failed` boolean made every unresolved id read "not
     looked up" as soon as any batch failed -- so a genuinely dangling edge in
     a batch that succeeded was reported as unexamined. That is the same false
     statement the flag was added to prevent, pointing the other way. */
  const lookedUp = new Set();
  /* Batched, because /notes/edges refuses more than EDGE_LOOKUP_BATCH ids and
     nothing bounds how many a note may hold: a compiled wiki page's
     `source_ids` has a minimum and no maximum, so a page synthesized from a
     few hundred notes is valid and ordinary. Sending the union in one request
     made exactly those pages -- the most connected ones -- come back 422, and
     every label on them read "not looked up".

     Sequential rather than parallel: the note is already on screen, so this
     costs patience rather than usability, and firing a page's worth of
     requests at once is how a burst quota gets spent for no benefit. */
  let batches = 0;
  for (let start = 0; start < ids.length; start += EDGE_LOOKUP_BATCH) {
    /* Checked before each request rather than once at the end. The loop
       outlives the note that started it: a reader who opens a large page and
       clicks away had every remaining batch still sent, spending their quota
       on labels for a panel nobody is looking at and delaying the lookups for
       the note they actually opened. */
    if (stillWanted && !stillWanted()) break;
    if (batches >= EDGE_LOOKUP_MAX_BATCHES) break;
    batches += 1;
    const batch = ids.slice(start, start + EDGE_LOOKUP_BATCH);
    try {
      /* A POST body, not a query string. Ids are capped in count and not in
         length, so a hundred long ones exceed the request line Heroku's
         router accepts and the request dies before reaching the app. */
      const payload = await api("/notes/edges", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ids: batch }),
      });
      for (const edge of payload.edges || []) edges.set(edge.note_id, edge);
      for (const id of batch) lookedUp.add(id);
    } catch (err) {
      if (err.sessionEnded) throw err;
      /* One failed batch does not discard the ones that answered, and does
         not claim anything about their ids either: this batch's ids simply
         never enter `lookedUp`. */
    }
  }
  return { edges, lookedUp };
}

/* The resolution object before the lookup answers. Shared and never mutated:
   `edgeList` only reads it. */
const PENDING_EDGES = { edges: new Map(), lookedUp: new Set(), pending: true };

/* An edge the caller could not resolve is shown as its bare id and is not a
   link, which is the honest rendering: there is an edge, and it points at
   something you cannot open. Three different situations arrive here as one --
   no such note, one the read policy withholds, one that is flagged -- and the
   endpoint declines to tell them apart on purpose, since doing so would
   confirm that an id exists. */
function edgeList(label, ids, resolution) {
  const resolved = resolution.edges;
  const wrap = el("div", "small");
  wrap.appendChild(el("span", "muted", label + ": "));
  let unresolved = 0;
  let unexamined = 0;
  ids.forEach((id, index) => {
    if (index > 0) wrap.appendChild(document.createTextNode(", "));
    const edge = resolved.get(id);
    if (!edge) {
      /* The marker is text, not a tooltip and not the muted colour. A `title`
         on a span is unreachable by keyboard and unreliable to a screen
         reader, and colour alone is not a distinction -- so the one thing
         that says "this is not a link" would have been available only to a
         sighted mouse user who hovered it. */
      /* Decided per id, because within one note both can be true: a batch
         that answered may contain a genuinely dangling edge while another
         batch never returned. Only the first is a statement about the corpus.
         Pending means no answer yet; unexamined means none was obtained for
         this id; neither says anything about the note it names. */
      const examined = !resolution.pending && resolution.lookedUp.has(id);
      if (examined) unresolved += 1;
      else if (!resolution.pending) unexamined += 1;
      wrap.appendChild(el("span", "mono muted", id));
      wrap.appendChild(el("span", "muted",
        resolution.pending ? " (resolving…)"
          : examined ? " (unresolved)"
            : " (not looked up)"));
      return;
    }
    const link = el("button", "link", edge.slug);
    /* The title is what the slug is a slug *of*, and the slug is what a
       `[[wikilink]]` to this note carries -- so the label matches the exported
       tree and the tooltip says which note it means. */
    link.title = edge.title;
    link.onclick = () => openNote(edge.note_id).catch(showError);
    wrap.appendChild(link);
  });
  /* Not `else if`: a note can have both, and each line explains only the
     marker it belongs to. Saying only one of them would leave the other
     marker unexplained on the same screen. */
  if (!resolution.pending && unexamined) {
    /* A statement about this request, not about the corpus. Those ids are
       still shown -- they are what the note actually holds -- but nothing
       claims to know what they point at. */
    wrap.appendChild(el("div", "small warn",
      "⚠ Some ids could not be looked up just now and are shown as stored. "
      + "That says nothing about whether those notes exist — retry to "
      + "resolve them."));
  }
  if (!resolution.pending && unresolved) {
    /* Said once rather than per id: what "unresolved" means, in the place a
       reader meets it, without needing to hover anything. */
    wrap.appendChild(el("div", "small muted",
      "An unresolved id names no note you can open — it may have been "
      + "retired, or it may be outside what this credential may read."));
  }
  return wrap;
}

async function openNote(noteId) {
  const generation = ++NOTE_GENERATION;
  /* Opening a note is newer navigation than any listing request still in
     flight. It may not rewrite the preserved listing behind this note. */
  LISTING_REQUEST_GENERATION += 1;
  LISTING_VIEW_GENERATION += 1;
  /* Fetched before anything is hidden. Switching panels first left a 404, a
     dropped connection or a 500 showing an empty note panel with no Back
     control on it -- the listing gone, nothing in its place, and no way out
     but a reload. Nothing moves until there is something to show. */
  let detail;
  try {
    detail = await api("/notes/" + encodeURIComponent(noteId));
  } catch (err) {
    if (generation !== NOTE_GENERATION) return;
    throw err;
  }
  if (generation !== NOTE_GENERATION) return;

  const panel = $("note");
  panel.textContent = "";
  panel.classList.remove("hidden");
  $("listing").classList.add("hidden");
  NOTE = detail;

  const actions = el("div", "row");
  const back = el("button", null, "Back to listing");
  back.onclick = () => {
    NOTE_GENERATION += 1;
    NOTE = null;
    panel.classList.add("hidden");
    panel.textContent = "";
    $("listing").classList.remove("hidden");
  };
  actions.appendChild(back);

  const propose = el("button", null, "Propose an edit");
  propose.id = "propose-open";
  propose.onclick = startPropose;
  const refusal = proposeRefusal(detail);
  if (refusal) {
    propose.disabled = true;
    propose.title = refusal;
  }
  actions.appendChild(propose);
  panel.appendChild(actions);
  /* Said on the page, not only in a tooltip: a disabled control explains
     itself to a mouse and to nobody else. */
  if (refusal) panel.appendChild(el("div", "small muted", refusal));

  const head = el("div", "row");
  head.appendChild(el("span", "title", detail.title));
  head.appendChild(el("span", "chip", detail.kind));
  if (detail.doc_type) head.appendChild(el("span", "chip", detail.doc_type));
  if (detail.doc_status) head.appendChild(el("span", "chip", detail.doc_status));
  panel.appendChild(head);
  panel.appendChild(el("div", "small muted mono", detail.vault_path));
  panel.appendChild(el("div", "small muted mono", "revision " + detail.content_revision));
  if (detail.summary) panel.appendChild(el("div", "small", detail.summary));
  if (detail.tags.length) {
    panel.appendChild(el("div", "small muted", "tags: " + detail.tags.join(", ")));
  }
  for (const [name, values] of Object.entries(detail.facets || {})) {
    panel.appendChild(el("div", "small muted", name + ": " + values.join(", ")));
  }
  /* Placeholders now, names later. The edge lookup used to be awaited before
     the panel was painted, on the reasoning that a note should not appear and
     then rearrange itself -- but `api` has no timeout, so a stalled
     /notes/edges left the note itself invisible for as long as the request
     hung. The note is the thing the reader asked for; the names on its edges
     are an enrichment, and an enrichment must not gate it.

     The ids are already known and are what the note actually holds, so the
     sections are not empty while resolving -- only unlabelled. */
  const edgeSlots = [];
  for (const [label, ids] of [
    ["related", detail.related_ids],
    ["sources", detail.source_ids],
  ]) {
    if (!ids.length) continue;
    const slot = el("div");
    /* The same renderer, in its pending state, so the ids are on screen from
       the first paint. A placeholder reading only "related: resolving…" would
       hide the one thing the note actually holds -- and hide it for exactly
       as long as the lookup stalls, which is the failure this whole
       arrangement exists to avoid. */
    slot.appendChild(edgeList(label, ids, PENDING_EDGES));
    panel.appendChild(slot);
    edgeSlots.push({ label, ids, slot });
  }

  /* The body as it is written: markdown source, not rendered. Rendering it
     would mean a markdown implementation the page cannot fetch under its own
     CSP, and hand-rolling one is how untrusted note text becomes markup. A
     `pre` block is honest and safe -- and this corpus is read as source by
     every other consumer it has. */
  const body = el("pre", "body", detail.body);
  body.id = "note-body";
  panel.appendChild(body);

  /* Deliberately not awaited: the note is on screen by now, and this only
     fills in labels. The generation check is what makes that safe -- a reader
     who has already navigated on must not have a stale note's edges written
     into whatever they are looking at instead. */
  if (edgeSlots.length) {
    const ids = Array.from(
      new Set([...detail.related_ids, ...detail.source_ids])
    );
    resolveEdges(ids, () => generation === NOTE_GENERATION)
      .then((resolution) => {
        if (generation !== NOTE_GENERATION) return;
        for (const { label, ids: edgeIds, slot } of edgeSlots) {
          slot.replaceChildren(edgeList(label, edgeIds, resolution));
        }
      })
      .catch((err) => {
        /* `resolveEdges` reports its own failures and rethrows only a dead
           session, which has already repainted the page. Nothing to add. */
        if (!err || !err.sessionEnded) showError(err);
      });
  }
}

/* ---------- Proposing an edit to the open note ----------

   The span edit exists for exactly this gesture: select a sentence, write a
   better one, and let the server work out the patch (ADR 0033, ADR 0039). The
   page sends the two texts and never a diff -- generating one here would mean a
   diff implementation this page cannot fetch under its own CSP. */

/* The selection as offsets into the body we were served, not as
   `Selection.toString()`.

   This is the whole correctness argument for the feature. `expected_text` has
   to be the stored text byte for byte or the server refuses it, and a
   stringified selection is a rendering of the text rather than the text: a
   `pre-wrap` block wraps long lines, and what a browser puts in the clipboard
   at a soft wrap has varied. Slicing `NOTE.body` at the offsets the range
   reports cannot disagree with what was stored, because it *is* what was
   stored.

   The `pre` holds exactly one text node -- `el()` sets `textContent` -- so a
   range that starts and ends inside it addresses that string directly. A
   selection reaching outside the body (the title, the metadata) is refused
   rather than clamped: it is not an edit to the note text. */
function selectedSpan() {
  const selection = window.getSelection();
  if (!selection || selection.isCollapsed || selection.rangeCount !== 1) return null;
  const body = $("note-body");
  if (!body || !body.firstChild || !NOTE) return null;

  const range = selection.getRangeAt(0);
  const text = body.firstChild;
  if (range.startContainer !== text || range.endContainer !== text) return null;
  if (range.endOffset <= range.startOffset) return null;

  return {
    start: range.startOffset,
    expected: NOTE.body.slice(range.startOffset, range.endOffset),
  };
}

/* Which match this is, counted the way the server counts.

   The server refuses an ambiguous span rather than guessing, and it is right
   to: a caller who has not thought about duplicates believes their text is
   unique. Here the caller has pointed at one instance, so the ambiguity is
   already resolved and sending `occurrence` says which one they meant. Every
   starting offset counts, overlapping ones included, which is what
   `span_edit_to_unified_diff` does. */
function occurrenceOf(body, expected, start) {
  let seen = 0;
  let at = body.indexOf(expected);
  while (at !== -1 && at < start) {
    seen += 1;
    at = body.indexOf(expected, at + 1);
  }
  return seen + 1;
}

/* Why this note cannot be amended, or null when it can.

   Two reasons, both known before the operator fills anything in, and both
   worth saying rather than discovering at submit time.

   A wiki page is the sharper one. `Agent/wiki/` is readable, so pages list and
   open like notes, but `VaultAmendmentService.propose` accepts note targets
   only -- a proposal against a page comes back 404 "Note not found", which
   reads as a bug in the console rather than as the rule it is. A page restates
   the notes it was compiled from; the amendment belongs to those.

   The scope reason comes from `/authorization`, so a family authorized before
   this console asked for `vault:propose` says so. Unknown identity is not a
   refusal: the honest failure is then the server's answer, not a guess here. */
function proposeRefusal(detail) {
  if (detail.kind !== "note") {
    return "Only notes take amendments. A " + detail.kind
      + " is compiled from notes -- propose against the notes it was built from.";
  }
  if (IDENTITY && IDENTITY.scopes && !IDENTITY.scopes.includes("vault:propose")) {
    return "This credential holds vault:read only.";
  }
  return null;
}

/* The same span, chosen by line number instead of by dragging.

   A `pre` is not focusable and shift+arrow does not select inside one without
   caret browsing, so a mouse selection was the only way in and the core action
   of this console was unreachable from the keyboard. Line numbers are the
   selection a reader can name out loud, and they resolve to exactly the same
   offsets: no separate code path, no second definition of what a span is. */
function spanFromLines(from, to) {
  const lines = NOTE.body.split("\n");
  if (!Number.isInteger(from) || !Number.isInteger(to)
      || from < 1 || to < from || to > lines.length) return null;
  let start = 0;
  for (let i = 0; i < from - 1; i += 1) start += lines[i].length + 1;
  return { start, expected: lines.slice(from - 1, to).join("\n") };
}

function lineOf(offset) {
  /* Which line an offset falls on, so a mouse selection can seed the line
     inputs and the two ways of choosing agree about what is chosen. */
  return NOTE.body.slice(0, offset).split("\n").length;
}

function proposeForm(span) {
  const form = el("div", "card");
  form.id = "propose";
  let current = span;

  const lines = NOTE.body.split("\n");
  const first = lineOf(current.start);
  const last = lineOf(current.start + current.expected.length);

  const range = el("div", "filters");
  const fromField = el("label", "field");
  fromField.htmlFor = "propose-from";
  fromField.appendChild(el("span", "small muted", "From line"));
  const fromInput = document.createElement("input");
  fromInput.id = "propose-from";
  fromInput.type = "number";
  fromInput.step = "1";
  fromInput.min = "1";
  fromInput.max = String(lines.length);
  fromInput.value = String(first);
  fromField.appendChild(fromInput);

  const toField = el("label", "field");
  toField.htmlFor = "propose-to";
  toField.appendChild(el("span", "small muted", "To line"));
  const toInput = document.createElement("input");
  toInput.id = "propose-to";
  toInput.type = "number";
  toInput.step = "1";
  toInput.min = "1";
  toInput.max = String(lines.length);
  toInput.value = String(last);
  toField.appendChild(toInput);

  range.append(fromField, toField);
  form.appendChild(range);
  form.appendChild(el("div", "small muted",
    "Selecting text in the note fills these in; typing line numbers does the "
    + "same thing without a mouse."));

  /* Built before `reaim`, which disables and re-enables Submit. A `const`
     declared further down would sit in its temporal dead zone -- the same
     shape as the module-initialisation bug the session module carries a test
     for -- so the ordering is deliberate rather than incidental. */
  const submit = el("button", "primary", "Propose");
  const cancel = el("button", null, "Cancel");

  const quoted = el("pre", "excerpt", current.expected);
  form.appendChild(el("div", "small muted", "Replacing this exact text:"));
  form.appendChild(quoted);

  const replacement = document.createElement("textarea");
  replacement.id = "propose-replacement";
  replacement.rows = Math.min(12, current.expected.split("\n").length + 2);
  /* Prefilled with what is there, because the common edit is a rewording
     rather than a rewrite. An unchanged replacement is refused by the server
     as a change that changes nothing, which is the right answer to a
     submission nobody edited. */
  replacement.value = current.expected;
  form.appendChild(replacement);

  /* Re-seeding the replacement is only safe while it still matches the span it
     was seeded from. Once the operator has typed, changing the line numbers
     re-aims the edit and keeps their words. */
  let pristine = true;
  /* True while the replacement still *is* the span it was seeded from.
     Written inverted once, which made it mean the opposite of its name:
     every edit marked the field pristine, so re-aiming the range then
     overwrote the operator's words with the new span -- the one thing the
     flag exists to prevent. */
  replacement.oninput = () => {
    pristine = current !== null && replacement.value === current.expected;
  };

  const readRange = () =>
    spanFromLines(Number(fromInput.value), Number(toInput.value));

  const reaim = () => {
    const next = readRange();
    if (!next) {
      /* Invalidated, not merely reported. Leaving `current` on the last
         valid span kept Submit live, and it posted an edit against lines
         the form had stopped showing as chosen. */
      current = null;
      submit.disabled = true;
      quoted.textContent = "";
      quoted.appendChild(el("span", "muted",
        "No such lines. The note has " + lines.length + "."));
      return;
    }
    if (pristine) {
      replacement.value = next.expected;
      replacement.rows = Math.min(12, next.expected.split("\n").length + 2);
    }
    current = next;
    submit.disabled = false;
    quoted.textContent = next.expected;
  };
  fromInput.oninput = reaim;
  toInput.oninput = reaim;

  const rationale = document.createElement("input");
  rationale.id = "propose-rationale";
  rationale.placeholder = "why this reads better, for the reviewer";
  rationale.className = "grow";
  form.appendChild(rationale);

  const actions = el("div", "row");
  actions.append(submit, cancel);
  form.appendChild(actions);
  form.appendChild(el("div", "small muted",
    "Queued for a reviewer. Nothing changes in the note until they accept it, "
    + "and an empty replacement is a removal they must acknowledge."));

  cancel.onclick = () => {
    form.remove();
    $("propose-open").focus();
  };
  submit.onclick = async () => {
    /* `current` preserves an exact mouse selection, including a substring of
       one line. The line-input handlers replace it when the operator explicitly
       re-aims the edit, and invalidate it when that range does not exist. */
    const span = current;
    if (!span) {
      say("danger", el("div", null,
        "Those line numbers are outside the note. Choose lines that exist."));
      return;
    }
    if (!span.expected.trim()) {
      say("danger", el("div", null,
        "Those lines are empty. Choose lines with text on them."));
      return;
    }
    if (!rationale.value.trim()) {
      say("danger", el("div", null, "A rationale is required: it is what the reviewer decides on."));
      return;
    }
    submit.disabled = cancel.disabled = true;
    try {
      const outcome = await api("/amendment-proposals", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          target_note_id: NOTE.note_id,
          /* The revision this page actually read. If the note moved since,
             the server answers 409 and the edit is refused rather than applied
             to text nobody saw. */
          base_revision: NOTE.content_revision,
          change: {
            kind: "span",
            expected_text: span.expected,
            replacement_text: replacement.value,
            occurrence: occurrenceOf(NOTE.body, span.expected, span.start),
          },
          rationale: rationale.value.trim(),
        }),
      });
      form.replaceChildren(el("div", "small",
        "Proposed. A reviewer decides it: " + outcome.proposal.proposal_id));
    } catch (err) {
      submit.disabled = cancel.disabled = false;
      if (err.sessionEnded) return;
      if (err.forbidden) {
        say("danger", el("div", null,
          "This credential may not propose. Sign out and in again to authorize "
          + "with vault:propose."));
        return;
      }
      /* 409 and 422 arrive here as ordinary errors carrying the server's own
         explanation, which is better than one written twice: it knows whether
         the note moved or the span stopped matching. */
      say("danger", el("div", null, err.message));
    }
  };
  return form;
}

function startPropose() {
  clearMessages();
  const existing = $("propose");
  if (existing) existing.remove();

  /* Checked again here, not only when the button was built: the button is
     built once per note and `IDENTITY` can arrive after it. */
  const refusal = proposeRefusal(NOTE);
  if (refusal) {
    say("info", el("div", null, refusal));
    return;
  }

  /* A selection when there is one, the first line when there is not. Opening
     with no selection is the keyboard path, and it opens on something real
     rather than refusing until a mouse has been used. */
  const span = selectedSpan() || spanFromLines(1, 1);
  if (!span) return;
  $("note").appendChild(proposeForm(span));
  $("propose-replacement").focus();
}


/* ---------- Shell ---------- */
function showError(err) {
  if (err.sessionEnded) return;
  if (err.forbidden) {
    say("danger", el("div", null,
      "This credential may not read the vault. Sign out and in again to "
      + "authorize with vault:read."));
    return;
  }
  say("danger", el("div", null, err.message));
}

async function loadAll() {
  clearMessages();
  refreshIdentity();
  NOTE_GENERATION += 1;
  $("note").classList.add("hidden");
  $("listing").classList.remove("hidden");
  try {
    await renderListing(false);
  } catch (err) {
    showError(err);
  }
}

function render() {
  const signedIn = Boolean(TOKEN);
  $("signin").classList.toggle("hidden", signedIn);
  $("signout").classList.toggle("hidden", !signedIn);
  $("refresh").classList.toggle("hidden", !signedIn);
  $("app").classList.toggle("hidden", !signedIn);
  paintWho();
  clearMessages();
  if (PENDING_ERROR) {
    say("danger", el("div", null, PENDING_ERROR));
    PENDING_ERROR = null;
  }
  if (!signedIn) {
    const intro = document.createElement("div");
    intro.appendChild(el("strong", null, "Sign in to browse."));
    intro.appendChild(el("p", "small",
      "This console authorizes as its own OAuth client holding vault:read and "
      + "vault:propose. Both are baseline scopes, so signing in is all it needs — "
      + "no operator grant, unlike the review console."));
    say("info", intro);
    return;
  }
  loadAll();
}

$("signin").onclick = () => signIn().catch((e) => say("danger", el("div", null, e.message)));
$("signout").onclick = signOut;
$("refresh").onclick = loadAll;
$("apply-filters").onclick = () => {
  FILTERS = { tag: $("filter-tag").value.trim(), facet: $("filter-facet").value.trim() };
  loadAll();
};
$("clear-filters").onclick = () => {
  $("filter-tag").value = "";
  $("filter-facet").value = "";
  FILTERS = { tag: "", facet: "" };
  loadAll();
};

/* Last, because `boot` renders and `render` reaches every handler above. */
boot();
</script>
</body>
</html>
